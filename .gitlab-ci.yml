stages:
  - test
  - build
  - cross-compile

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

cache:
  paths:
    - .pip-cache/

test:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update && apt-get install -y gcc cmake make git
    - pip install -e ".[dev]"
  script:
    # Python tests with coverage
    - python -m pytest tests/ -v --tb=short --cov=bakec --cov-report=term-missing

    # Generate all 9 model x platform combos
    - |
      for model in lung_mnarx pid_controller lookup_table_1d; do
        for plat in desktop cortex_m4 aurix_tc397; do
          python -m bakec.cli generate \
            --model models/${model}.yaml \
            --platform platforms/${plat}.yaml \
            --output generated/${plat}/
        done
      done

    # Verify generated code matches committed (ignore timestamps/hashes)
    - git diff --exit-code -I '^\s*\*\s*Date:' -I 'sha256:' generated/

    # Validate generated code
    - python -m bakec.cli validate --target generated/desktop/ --rules src/bakec/checks/rules.yaml --platforms-dir platforms/
    - python -m bakec.cli validate --target generated/cortex_m4/ --rules src/bakec/checks/rules.yaml --platforms-dir platforms/
    - python -m bakec.cli validate --target generated/aurix_tc397/ --rules src/bakec/checks/rules.yaml --platforms-dir platforms/

    # Compile and run C tests (desktop)
    - cmake -B build/out -S build -DPLATFORM=desktop
    - cmake --build build/out
    - ctest --test-dir build/out --output-on-failure

build:
  stage: build
  image: python:3.12-slim
  needs: [test]
  before_script:
    - apt-get update && apt-get install -y gcc cmake make git
    - pip install -e ".[dev]"
  script:
    - make all

cross-compile:
  stage: cross-compile
  image: python:3.12-slim
  needs: [test]
  before_script:
    - apt-get update && apt-get install -y gcc-arm-none-eabi cmake make
    - pip install -e ".[dev]"
  script:
    - |
      for model in lung_mnarx pid_controller lookup_table_1d; do
        python -m bakec.cli generate \
          --model models/${model}.yaml \
          --platform platforms/cortex_m4.yaml \
          --output generated/cortex_m4/
      done
    - cmake -B build/arm -S build -DPLATFORM=cortex_m4
    - cmake --build build/arm
